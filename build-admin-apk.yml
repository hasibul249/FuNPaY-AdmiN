name: Build FuNPaY Admin
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: funpay-admin-build
  cancel-in-progress: false
jobs:
  # ০) আপলোড করা .zip থাকলে নিজে আনজিপ করে রিপোতে বসায়
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.p.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          Z="$(ls -1 *.zip 2>/dev/null | head -1 || true)"
          if [ -n "$Z" ]; then
            mkdir -p /tmp/x && unzip -q -o "$Z" -d /tmp/x
            D=/tmp/x
            if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then D="/tmp/x/$(ls -A /tmp/x)"; fi
            rm -rf "$D/.github"
            cp -a "$D"/. .
            git rm -qf -- *.zip
            git config user.name "unzip-bot"; git config user.email "unzip@users.noreply.github.com"
            git add -A
            git commit -qm "Upload $Z" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # ১) OTA আপডেট: কোড পুশ/আপলোড করলেই ১-২ মিনিটে সব অ্যাডমিন অ্যাপে নিজে নতুন কোড চলে আসে, APK লাগে না
  ota:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Version stamp
        env:
          SU: ${{ secrets.SUPA_URL }}
          SK: ${{ secrets.SUPA_KEY }}
        run: |
          VER="1.3.${{ github.run_number }}"
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i "s|const APP_VERSION = \"[^\"]*\";|const APP_VERSION = \"$VER\";|" www/js/admin.js
          sed -i "s|name=\"fp-build\" content=\"[^\"]*\"|name=\"fp-build\" content=\"$VER\"|" www/index.html
          sed -i "s|const OTA_URL = \"\";|const OTA_URL = \"https://raw.githubusercontent.com/${{ github.repository }}/ota/ota.json\";|" www/js/admin.js
          [ -n "$SU" ] && sed -i "s|const SUPA_URL = \"\";|const SUPA_URL = \"$SU\";|" www/js/admin.js || true
          [ -n "$SK" ] && sed -i "s|const SUPA_KEY = \"\";|const SUPA_KEY = \"$SK\";|" www/js/admin.js || true
      - name: Bundle and publish
        run: |
          mkdir out
          NOTES="$(cat update-notes.txt 2>/dev/null || echo 'নতুন আপডেট')"
          jq -n --arg v "$VER" --rawfile js www/js/admin.js --rawfile css www/css/admin.css '{version:$v,js:$js,css:$css}' > out/app-$VER.json
          jq -n --arg v "$VER" --arg u "https://raw.githubusercontent.com/${{ github.repository }}/ota/app-$VER.json" --arg n "$NOTES" '{version:$v,pkg:$u,notes:$n}' > out/ota.json
          cd out
          git init -q -b ota
          git config user.name "ota-bot"; git config user.email "ota@users.noreply.github.com"
          git add .; git commit -qm "OTA $VER"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ota
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@ota/ota.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@ota/app-$VER.json" || true
  # ২) APK: শুধু প্রথমবার ইনস্টলের জন্য (বা নতুন নেটিভ ফিচার যোগ করলে)
  apk:
    needs: prepare
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Supabase সেটিং বসানো (Secrets থেকে)
        env:
          SU: ${{ secrets.SUPA_URL }}
          SK: ${{ secrets.SUPA_KEY }}
        run: |
          VER="1.3.${{ github.run_number }}"
          sed -i "s|const APP_VERSION = \"[^\"]*\";|const APP_VERSION = \"$VER\";|" www/js/admin.js
          sed -i "s|name=\"fp-build\" content=\"[^\"]*\"|name=\"fp-build\" content=\"$VER\"|" www/index.html
          sed -i "s|const OTA_URL = \"\";|const OTA_URL = \"https://raw.githubusercontent.com/${{ github.repository }}/ota/ota.json\";|" www/js/admin.js
          [ -n "$SU" ] && sed -i "s|const SUPA_URL = \"\";|const SUPA_URL = \"$SU\";|" www/js/admin.js || true
          [ -n "$SK" ] && sed -i "s|const SUPA_KEY = \"\";|const SUPA_KEY = \"$SK\";|" www/js/admin.js || true
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: node scripts/fix-android.js
      - name: App icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#2a1220" --iconBackgroundColorDark "#2a1220"
      - run: npx cap sync android
      - name: Build APK (নেটওয়ার্ক ফসকালে ৩ বার চেষ্টা)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --refresh-dependencies --no-daemon && exit 0
            echo "চেষ্টা $i ব্যর্থ, ৩০ সেকেন্ড পরে আবার"; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: FuNPaY-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Direct download link
        run: |
          mkdir apkout && cp android/app/build/outputs/apk/debug/app-debug.apk apkout/FuNPaY-Admin.apk
          cd apkout
          git init -q -b apk
          git config user.name "apk-bot"; git config user.email "apk@users.noreply.github.com"
          git add .; git commit -qm "APK"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
